name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Check CLI entrypoints
        run: |
          python scripts/prepare_source.py --help
          python scripts/moyu_pipeline.py --help
          python scripts/publish_deliverables.py --help
          python scripts/audit_media_batch.py --help
          python scripts/ensure_canonical_mp4.py --help
